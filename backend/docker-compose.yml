# docker-compose.yml pour déploiement Coolify
version: '3.8'

services:
  # API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutraider-backend
    environment:
      - APP_NAME=ScoutRaider API
      - APP_VERSION=1.0.0
      - DEBUG=false
      - API_PREFIX=/api
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@postgres:5432/scoutraider
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      # Garage S3 (Coolify)
      - GARAGE_ENDPOINT=https://s3-scoutraider.silverhorse.fr
      - GARAGE_PUBLIC_URL=https://s3-scoutraider.silverhorse.fr
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_BUCKET=scoutraider-assets
      - GARAGE_REGION=garage
      - CORS_ORIGINS=["https://scoutraider.app","https://app.scoutraider.app"]
    depends_on:
      - postgres
    networks:
      - scoutraider-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: scoutraider-postgres
    environment:
      - POSTGRES_DB=scoutraider
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scoutraider-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d scoutraider"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration Alembic (run once)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutraider-migrate
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@postgres:5432/scoutraider
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scoutraider-network
    restart: "no"

volumes:
  postgres_data:

networks:
  scoutraider-network:
    driver: bridge
    name: scoutraider-network