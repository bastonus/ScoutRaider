name: Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl --silent --show-error --fail \
            --request GET \
            "https://host.silverhorse.fr/api/v1/deploy?uuid=og78cnruazg5wkwx9aygludb&force=false" \
            --header "Authorization: Bearer 4|7cY6lhB2GAxgdyjHtB1THZL0UJSr1UEreDmm1RnI62906306" \
            && echo "✅ Coolify redeploy triggered" \
            || echo "⚠️ Coolify webhook failed"
