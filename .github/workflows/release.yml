name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ScoutCarnet.spec --noconfirm

      - name: Create ZIP archive
        working-directory: dist
        run: Compress-Archive -Path ScoutCarnet -DestinationPath ScoutRaider-Suite-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Suite-Windows
          path: dist/ScoutRaider-Suite-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ScoutCarnet.spec --noconfirm

      - name: Create ZIP archive
        working-directory: dist
        run: zip -r ScoutRaider-Suite-macOS.zip ScoutCarnet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Suite-macOS
          path: dist/ScoutRaider-Suite-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ScoutCarnet.spec --noconfirm

      - name: Create tar.gz archive
        working-directory: dist
        run: tar -czf ScoutRaider-Suite-Linux.tar.gz ScoutCarnet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Suite-Linux
          path: dist/ScoutRaider-Suite-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScoutRaider Suite ${{ github.ref_name }}"
          body: |
            ## ScoutRaider Suite (Beta) ${{ github.ref_name }}
            
            Découvrez la version Beta de **ScoutRaider Suite**, l'application de bureau conçue pour les chefs et cheftaines permettant de planifier, concevoir et générer automatiquement des carnets de raid scout complets. Tracez votre itinéraire, assignez des épreuves et créez des carnets PDF d'exploration !

            ⚠️ **Avertissement Sécurité** : Les azimuts et métrages sont calculés algorithmiquement. Vérifiez toujours l'itinéraire manuellement sur une carte papier avant d'envoyer vos scouts sur le terrain !

            ---

            ### 💾 Téléchargements
            - **Windows** : Téléchargez `ScoutRaider-Suite-Windows.zip` — Décompressez et lancez `ScoutCarnet.exe`
            - **macOS** : Téléchargez `ScoutRaider-Suite-macOS.zip` — Décompressez et lancez `ScoutCarnet`
            - **Linux** : Téléchargez `ScoutRaider-Suite-Linux.tar.gz` — Faites `tar xzf` et lancez `./ScoutCarnet`

            ---

            ### 🌟 Nouvelles Fonctionnalités
            - 🏕️ Générateur complet de carnets de raid scout personnalisables.
            - 🗺️ Carte interactive IGN et vue Satellite avec routage BRouter.
            - 🧭 Segmentation d'itinéraire automatique avec calcul d'azimuts et de métrages.
            - 🎲 11 Épreuves intégrées (Morse, Vigenère, Chiffres Romains, Azimut, etc.).
            - 🚨 Détection intelligente des zones dangereuses avec alertes.
            - 📄 Générateur PDF automatique du carnet participant et du corrigé !
            - 💡 **Outil Aide Intégré (?)** : Cliquez sur le "?" dans la barre d'outils de l'app pour accéder à un guide complet point par point !

            ---

            ### 🚀 Prochaines Étapes
            - **Distribution & Auto-updater** : Mise en place d'un installeur Windows (.exe), d'un DMG macOS, et d'un système de recherche automatique des mises à jour vérifiant les releases GitHub !
            - **Refonte de la Recherche** : Autocomplétion intégrée aux champs itinéraires ("façon Google Maps").
            - **Drag & Drop** : Réorganisation des étapes interactive sur la carte et la liste.
            - **Import Externe** : Support du format GPX / KML depuis d'autres applications.
            
            ---

            ### 💬 Vos Retours Sont Précieux !
            ScoutRaider Suite est un outil pensé pour vos camps. Aidez-nous à façonner son avenir :
            - 🐛 Un bug rencontré ?
            - 💡 Une nouvelle épreuve à proposer ?
            👉 Rendez-vous sur notre [Page GitHub Issues](https://github.com/bastonus/ScoutRaider-Suite/issues) pour envoyer vos suggestions !
          draft: false
          prerelease: true
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
