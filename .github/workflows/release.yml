name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write  # Required to push Docker images to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────
  # BUILD WINDOWS
  # ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Windows
          path: dist_electron/*.exe

  # ─────────────────────────────────────────────────────────
  # BUILD MACOS
  # ─────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-macOS
          path: dist_electron/*.dmg

  # ─────────────────────────────────────────────────────────
  # BUILD LINUX
  # ─────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpango1.0-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Linux
          path: dist_electron/*.AppImage

  # ─────────────────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGE (Web / Coolify)
  # Runs in parallel with the Electron builds
  # Pushes to GitHub Container Registry (ghcr.io)
  # Coolify can pull from there automatically
  # ─────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extract version tag and repo info for image labels
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the git version tag (e.g. v0.3.3-beta)
            type=semver,pattern={{version}}
            # Also always update the 'latest' tag
            type=raw,value=latest

      # Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enable cross-platform builds (optional, linux/amd64 is sufficient for Coolify)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache between runs for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # RELEASE — Attach all installers to the GitHub Release
  # Waits for all builds (Electron + Docker)
  # Each artifact is downloaded independently to avoid one
  # transient failure blocking the entire release.
  # ─────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ScoutRaider-Windows
          path: release-artifacts/ScoutRaider-Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ScoutRaider-macOS
          path: release-artifacts/ScoutRaider-macOS

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ScoutRaider-Linux
          path: release-artifacts/ScoutRaider-Linux

      - name: List downloaded artifacts
        run: find release-artifacts -type f | sort || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScoutRaider ${{ github.ref_name }} (Beta)"
          body: |
            ## 🏕️ ScoutRaider ${{ github.ref_name }}

            ### 🆕 Nouveautés de cette version
            - 🎨 **Dessin vectoriel** : redimensionnez, tournez et déplacez un trait ou un groupe entier grâce au nouveau Transformer (8 poignées + rotation), avec aperçu temps réel.
            - 🗂️ **Sous-calques** : chaque trait d'un dessin est sélectionnable, colorisable et supprimable individuellement dans le gestionnaire de calques.
            - 📋 **Panneau contextuel** : le panneau de gauche affiche les informations du calque sélectionné (itinéraire, zone, repère ou dessin).
            - 🧭 **Focus itinéraire** : l'itinéraire actif s'affiche en plein ; les autres apparaissent en pointillés et restent cliquables.
            - ✨ **Nettoyage automatique** des calques vides et **ordre des calques sauvegardé** dans le document.
            - ⌨️ **Raccourcis** : `Ctrl+T` (trait ↔ groupe), `Suppr`, `Échap`, `F2`, `Espace`.
            - 📝 Voir le détail complet dans le [CHANGELOG](https://github.com/bastonus/ScoutRaider/blob/main/CHANGELOG.md).

            ### 💾 Installation — Desktop
            | Plateforme | Fichier | Instructions |
            |---|---|---|
            | 🪟 **Windows** | `ScoutRaider Setup.exe` | Double-cliquez pour installer |
            | 🍎 **macOS** | `ScoutRaider.dmg` | Ouvrez le DMG → Glissez l'app dans Applications |
            | 🐧 **Linux** | `ScoutRaider.AppImage` | `chmod +x *.AppImage` puis lancez |

            ### 🌐 Version Web
            👉 **[scoutraider.silverhorse.fr](https://scoutraider.silverhorse.fr/)**

            Image Docker disponible sur GitHub Container Registry :
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            Ou toujours la dernière version :
            ```
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ---

            ⚠️ **Avertissement Sécurité** : Les azimuts et métrages sont calculés algorithmiquement. Vérifiez toujours l'itinéraire manuellement sur une carte papier avant d'envoyer vos scouts sur le terrain !

            ---

            ### 💬 Vos Retours Sont Précieux !
            👉 [Page GitHub Issues](https://github.com/bastonus/ScoutRaider/issues)
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
