name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # BUILD WINDOWS
  # ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Windows
          path: dist_electron/*.exe

  # ─────────────────────────────────────────────────────────
  # BUILD MACOS
  # ─────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-macOS
          path: dist_electron/*.dmg

  # ─────────────────────────────────────────────────────────
  # BUILD LINUX
  # ─────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpango1.0-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Build Python Backend (Placeholder)
        shell: bash
        run: |
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt

      - name: Build React App (Vite)
        run: npm run build

      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: ScoutRaider-Linux
          path: dist_electron/*.AppImage

  # ─────────────────────────────────────────────────────────
  # RELEASE — Attach all installers to the GitHub Release
  # ─────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScoutRaider ${{ github.ref_name }} (Beta)"
          body: |
            ## 🏕️ ScoutRaider ${{ github.ref_name }} — Version Beta

            ### 🚀 Mise à jour de la Beta 0.3.2
            - **Nouveau panneau d'exportation** : Une fenêtre d'exportation toute neuve, beaucoup plus propre.
            - **Support CSV & TSV** : Prise en charge des formats de données tabulaires (CSV et TSV), préparant la future implémentation des formats de documents tels que le DOCX, le PDF et le HTML.
            - **Nouvel outil "Hors-piste"** : Cet outil permet de tracer des parcours hors-piste (points en vol d'oiseau formant des polygones).
            - **Corrections des outils** : Réparations et améliorations sur les problèmes rencontrés avec les quatre outils principaux.

            ### ✨ Nouveautés générales de la branche Beta 0.3
            - **Migration Electron** : Passage à une architecture moderne en **React / Electron**.
            - **Design System** : Interface glassmorphique sombre et moderne.
            - **Carte Interactive** : Intégration optimisée de Leaflet avec routage automatique.

            ⚠️ **Avertissement Sécurité** : Les azimuts et métrages sont calculés algorithmiquement. Vérifiez toujours l'itinéraire manuellement sur une carte papier avant d'envoyer vos scouts sur le terrain !

            ---

            ### 💾 Installation
            | Plateforme | Fichier | Instructions |
            |---|---|---|
            | 🪟 **Windows** | `ScoutRaider Setup.exe` | Double-cliquez pour installer |
            | 🍎 **macOS** | `ScoutRaider.dmg` | Ouvrez le DMG → Glissez l'app dans Applications |
            | 🐧 **Linux** | `ScoutRaider.AppImage` | `chmod +x *.AppImage` puis lancez |

            ---

            ### 💬 Vos Retours Sont Précieux !
            👉 [Page GitHub Issues](https://github.com/bastonus/ScoutRaider/issues)
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
