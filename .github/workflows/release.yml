name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ==========================================
      # 🐍 DÉPENDANCES PYTHON (WEASYPRINT, ETC.)
      # ==========================================
      
      - name: Install System Dependencies for WeasyPrint (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpango1.0-dev

      - name: Install System Dependencies for WeasyPrint (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango libffi

      - name: Install System Dependencies for WeasyPrint (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # WeasyPrint sur Windows requiert GTK3 Runtime
          # On télécharge et installe silencieusement l'installateur MSYS2/GTK3
          # curl -LO https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe
          # ./gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe /S
          echo "Skipping GTK3 installation for now since backend is a placeholder"

      - name: Build Python Backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller weasyprint
          
          # TODO: Quand votre script Python sera prêt (ex: backend.py), utilisez ceci :
          # pip install -r python-requirements.txt
          # pyinstaller --noconfirm --onedir backend.py
          
          # Pour l'instant, on crée juste le dossier qui sera empaqueté par Electron
          mkdir -p python-dist
          echo "Placeholder pour l'exécutable Python" > python-dist/placeholder.txt
          # Plus tard : cp -r dist/backend/* python-dist/

      # ==========================================
      # ⚛️ BUILD ELECTRON
      # ==========================================
      
      - name: Install Node Dependencies
        run: npm install

      - name: Build React App (Vite)
        run: npm run build

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # npx electron-builder compile le code Electron et l'application Vite
          # et crée l'installeur (.exe, .dmg, .AppImage) selon l'OS courant.
          # L'option --publish always uploadera automatiquement les fichiers
          # sur la Release GitHub associée au tag de version (v*).
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --publish always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --linux --publish always
          fi
