server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API & Dynamic Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /modules/ {
        proxy_pass http://127.0.0.1:8000/modules/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location /diffraction/ {
        proxy_pass http://127.0.0.1:8000/diffraction/;
        proxy_set_header Host $host;
    }

    location /render/ {
        proxy_pass http://127.0.0.1:8000/render/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # Static Assets & Fonts Caching
    location ~* \.(css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Disable cache for index.html to ensure new versions are picked up immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA Routing: Fall back to index.html for any client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
